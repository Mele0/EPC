[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "epc-artefact"
version = "1.0.0"
description = "Reproducible analysis for the EPC Mirage study"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "pandas==3.0.3",
  "numpy==2.4.6",
  "scipy==1.17.1",
  "statsmodels==0.14.6",
  "patsy==1.0.2",
  "scikit-learn==1.9.0",
  "duckdb==1.5.3",
  "matplotlib==3.10.9",
  "pyarrow==24.0.0",
  "openpyxl==3.1.5",
  "tabulate==0.9.0",
]

[project.optional-dependencies]
map = [
  "geopandas==1.1.3",
  "pyogrio==0.12.1",
]

[project.urls]
Repository = "https://github.com/Mele0/EPC"

[tool.setuptools]
package-dir = {"" = "code/src"}

[tool.setuptools.packages.find]
where = ["code/src"]

[tool.ruff]
target-version = "py311"
