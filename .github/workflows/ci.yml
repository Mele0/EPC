name: reproducibility checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install locked runtime and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-lock.txt
          python -m pip install --no-deps -e .
          python -m pip install ruff==0.16.5
          python -m pip check
      - name: Verify environment lock and entry point
        run: |
          diff -u requirements.txt environment/requirements.txt
          diff -u requirements-lock.txt environment/requirements-lock.txt
          test -x run
          test -x code/run
          ./run --help
      - name: Static checks
        run: |
          python -m compileall -q code/scripts code/src tests
          ruff check --select E9,F63,F7,F82 code/scripts code/src tests
      - name: Unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
